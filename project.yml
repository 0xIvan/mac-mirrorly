name: MirrorlyMenuBar
options:
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  MirrorlyMenuBar:
    type: application
    platform: macOS
    sources:
      - path: Sources/MirrorlyMenuBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivan.mirrorlymenubar
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/MirrorlyMenuBar.entitlements
        GENERATE_INFOPLIST_FILE: NO
        MACOSX_DEPLOYMENT_TARGET: "13.0"
  MirrorlyMenuBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MirrorlyMenuBarTests
    dependencies:
      - target: MirrorlyMenuBar
schemes:
  MirrorlyMenuBar:
    build:
      targets:
        MirrorlyMenuBar: all
    test:
      targets:
        - MirrorlyMenuBarTests
