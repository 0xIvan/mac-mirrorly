name: MacMirrorly
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  MacMirrorly:
    type: application
    platform: macOS
    sources:
      - path: Sources/MacMirrorly
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivan.macmirrorly
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/MacMirrorly.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  MacMirrorlyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MacMirrorlyTests
    dependencies:
      - target: MacMirrorly
schemes:
  MacMirrorly:
    build:
      targets:
        MacMirrorly: all
    test:
      targets:
        - MacMirrorlyTests
